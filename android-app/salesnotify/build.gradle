plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saintsai.sales'
    compileSdk 35

    defaultConfig {
        applicationId "com.saintsai.sales"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("SAINTSAI_SALES_KEYSTORE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("SAINTSAI_SALES_STORE_PASSWORD")
                keyAlias System.getenv("SAINTSAI_SALES_KEY_ALIAS")
                keyPassword System.getenv("SAINTSAI_SALES_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("SAINTSAI_SALES_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}
