plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saintsai.stock'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.saintsai.stock"
        minSdk 24
        targetSdk 35
        versionCode 28
        versionName "1.2.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("SAINTSAI_CLIENT_KEYSTORE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("SAINTSAI_CLIENT_STORE_PASSWORD")
                keyAlias System.getenv("SAINTSAI_CLIENT_KEY_ALIAS")
                keyPassword System.getenv("SAINTSAI_CLIENT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("SAINTSAI_CLIENT_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Generate the bundled notification sound from a versioned text asset.
def saleSound = file("src/main/res/raw/sale_chime.wav")
saleSound.parentFile.mkdirs()
saleSound.bytes = Base64.decoder.decode(file("sale-chime.base64").text.trim())
