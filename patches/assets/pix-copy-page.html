<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Copiar Pix · SaintsAI</title><style>body{margin:0;background:#100b20;color:#f6f1ff;font:17px system-ui;min-height:100vh;display:grid;place-items:center}main{margin:24px;padding:28px;max-width:420px;border:1px solid #48315d;border-radius:24px;background:#1d142d}h1{font-size:27px}textarea{box-sizing:border-box;width:100%;height:125px;background:#120e1c;color:#ddd;border:1px solid #604574;border-radius:12px;padding:12px;resize:none}button{width:100%;margin:18px 0;padding:17px;border:0;border-radius:14px;background:#a86aff;color:#140825;font:bold 18px system-ui}button:disabled{opacity:.45}p{line-height:1.5;color:#d1c3df}#status{min-height:48px}</style><main><small>SaintsAI · Pagamento via Pix</small><h1>Copie seu Pix</h1><p>Toque no botão e cole no aplicativo do seu banco. Confira o recebedor e o valor antes de pagar.</p><textarea id="code" readonly aria-label="Código Pix"></textarea><button id="copy" disabled>Copiar Pix</button><p id="status" role="status">Verificando código…</p></main><script>
'use strict';
const field=document.getElementById('code'),button=document.getElementById('copy'),status=document.getElementById('status');
function crc16(s){let crc=0xffff;for(const b of new TextEncoder().encode(s)){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?(crc<<1)^0x1021:crc<<1;crc&=0xffff;}return crc.toString(16).toUpperCase().padStart(4,'0');}
let code='';try{code=decodeURIComponent(location.hash.slice(1));}catch{}
if(code.length<=2048&&/^000201[^\r\n]*6304[0-9A-Fa-f]{4}$/.test(code)&&crc16(code.slice(0,-4))===code.slice(-4).toUpperCase()){field.value=code;button.disabled=false;status.textContent='Pronto para copiar.';}else{status.textContent='Código Pix inválido ou incompleto. Peça um novo código na conversa.';}
button.onclick=async()=>{try{await navigator.clipboard.writeText(code);status.textContent='Pix copiado! Agora cole no aplicativo do banco.';button.textContent='Copiado';}catch{field.focus();field.select();if(document.execCommand('copy'))status.textContent='Pix copiado! Agora cole no aplicativo do banco.';else status.textContent='Seu navegador bloqueou a cópia. O código foi selecionado: toque em Copiar.';}};
</script></html>
