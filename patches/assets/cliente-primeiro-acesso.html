<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu primeiro acesso · SaintsAI</title><script src="js/theme.js"></script><link rel="stylesheet" href="css/styles.css"><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#100d19;color:#f7f4ff;font-family:Arial,sans-serif}main{width:min(440px,100%);padding:28px;box-sizing:border-box}small{color:#b998ff;letter-spacing:2px}h1{font-size:30px;margin:16px 0}p{color:#bcb5cb;line-height:1.5}label{display:block;font-size:14px;margin:20px 0 8px}input,button{width:100%;box-sizing:border-box;border-radius:8px;padding:15px;font:inherit}input{background:#1c1728;border:1px solid #3a304b;color:white}button{background:#8b5cf6;color:white;border:0;font-weight:bold;margin-top:24px;cursor:pointer}button:disabled{opacity:.6}#erro{color:#ffb7b7}a{color:#c2a5ff;display:inline-block;margin-top:20px}</style></head><body><main><small>SAINTSAI · BEM-VINDO</small><h1>Esta conta agora é sua.</h1><p>Seu agente já foi preparado. Antes de continuar, substitua o acesso temporário pelo seu e-mail e uma senha pessoal.</p><form id="form"><label for="email">Seu e-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="temporaria">Senha temporária recebida</label><input id="temporaria" type="password" autocomplete="current-password" required><label for="senha">Nova senha · mínimo de 10 caracteres</label><input id="senha" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><label for="confirmar">Repita a nova senha</label><input id="confirmar" type="password" autocomplete="new-password" required><p id="erro" role="alert"></p><button id="continuar">Salvar e entrar</button></form><a href="#" id="sair">Sair desta conta</a></main><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/first-access.js"></script></body></html>
