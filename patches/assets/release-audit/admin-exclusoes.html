<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitações de exclusão · SaintsAI</title><style>body{background:#101018;color:#f3edf9;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}article{background:#201b2a;padding:20px;margin:16px 0;border-radius:12px;overflow-wrap:anywhere}a{color:#cbb8ed}button{padding:14px;border-radius:12px;background:#a670f4;border:0;font:inherit}</style></head><body><main><a href="admin-mobile.html">← Painel</a><h1>Solicitações de exclusão</h1><p>Verifique a titularidade, encerre integrações e avalie a retenção necessária antes de excluir a conta pelo procedimento administrativo. Esta tela não apaga dados automaticamente.</p><div id="requests"></div><p id="status" role="status"></p><button id="more">Carregar solicitações</button></main><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script>let page=1,busy=false;document.getElementById('more').onclick=async()=>{if(busy)return;busy=true;const button=document.getElementById('more');button.disabled=true;try{const r=await apiFetch('/auth/admin/exclusoes?page='+page);for(const x of r.solicitacoes){const card=document.createElement('article');card.textContent=x.email+' · '+x.solicitado_em+' · Protocolo '+x.protocolo+' · Conta '+x.user_id;document.getElementById('requests').append(card);}page=r.proxima_pagina;button.hidden=!page;document.getElementById('status').textContent=page?'Há mais contas para consultar.':'Consulta concluída.';}catch(e){document.getElementById('status').textContent=e.message;}finally{busy=false;button.disabled=false;}};document.getElementById('more').click();</script></body></html>
