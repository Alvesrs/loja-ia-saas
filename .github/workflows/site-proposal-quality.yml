name: Site proposal real-photo quality
on:
  pull_request:
    paths:
      - 'site-proposal-quality/**'
      - 'tests/site-proposal-quality.test.cjs'
      - '.github/workflows/site-proposal-quality.yml'
  workflow_dispatch:
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real-photo and publication gates
        run: node --test tests/site-proposal-quality.test.cjs
