name: Build SaintsAI APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle --no-daemon :adminapp:assembleDebug :estoqueapp:assembleDebug

      - name: Rename APKs
        run: |
          cp adminapp/build/outputs/apk/debug/adminapp-debug.apk SaintsAI-Admin-v1.0.0.apk
          cp estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk SaintsAI-Estoque-v1.0.0.apk

      - name: Upload SaintsAI Admin
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Admin-APK-v1.0.0
          path: android-app/SaintsAI-Admin-v1.0.0.apk
          if-no-files-found: error

      - name: Upload SaintsAI Estoque
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Estoque-APK-v1.0.0
          path: android-app/SaintsAI-Estoque-v1.0.0.apk
          if-no-files-found: error
