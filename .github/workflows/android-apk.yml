name: Build SaintsAI APKs
# retest proxy real
# final retest after backend mount
# backend mount verified retest

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SALES_KEYSTORE_B64: ${{ secrets.SAINTSAI_SALES_KEYSTORE_B64 }}
      SALES_STORE_PASSWORD: ${{ secrets.SAINTSAI_SALES_STORE_PASSWORD }}
      SALES_KEY_ALIAS: ${{ secrets.SAINTSAI_SALES_KEY_ALIAS }}
      SALES_KEY_PASSWORD: ${{ secrets.SAINTSAI_SALES_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test SaintsAI client portal
        run: |
          set -e
          BASE="https://backend-prod-production-f338.up.railway.app"
          for path in \
            "/cliente/" \
            "/cliente/cliente-central.html" \
            "/cliente/cliente-configuracao.html" \
            "/cliente/cliente-agenda.html" \
            "/cliente/cliente-plano.html" \
            "/cliente/cliente-whatsapp.html"; do
            echo "===== $path ====="
            code=$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" "$BASE$path")
            echo "HTTP $code"
            test "$code" -ge 200
            test "$code" -lt 400
          done
          curl -fsSL "$BASE/cliente/cliente-agenda.html" -o /tmp/agenda.html
          grep -F "Agenda profissional" /tmp/agenda.html
          grep -F "No-show" /tmp/agenda.html
          curl -fsSL "$BASE/cliente/cliente-plano.html" -o /tmp/plano.html
          grep -F "Plano e cobrança" /tmp/plano.html
          curl -fsSL "$BASE/cliente/cliente-whatsapp.html" -o /tmp/whatsapp.html
          grep -F "SaintsAI · WhatsApp" /tmp/whatsapp.html

      - name: Build APKs
        run: gradle --no-daemon :adminapp:assembleDebug :estoqueapp:assembleDebug :salesnotify:assembleDebug

      - name: Prepare persistent sales signing
        if: env.SALES_KEYSTORE_B64 != ''
        run: |
          echo "$SALES_KEYSTORE_B64" | base64 -d > salesnotify/saintsai-sales-release.jks

      - name: Build signed Gerenciador release
        if: env.SALES_KEYSTORE_B64 != ''
        env:
          SAINTSAI_SALES_KEYSTORE: saintsai-sales-release.jks
          SAINTSAI_SALES_STORE_PASSWORD: ${{ env.SALES_STORE_PASSWORD }}
          SAINTSAI_SALES_KEY_ALIAS: ${{ env.SALES_KEY_ALIAS }}
          SAINTSAI_SALES_KEY_PASSWORD: ${{ env.SALES_KEY_PASSWORD }}
        run: gradle --no-daemon :salesnotify:assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 layout and keyboard regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-app/adminapp/build/outputs/apk/debug/adminapp-debug.apk
            adb install -r android-app/estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk

            adb shell am force-stop com.saintsai.admin
            adb shell monkey -p com.saintsai.admin -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-app/admin-screen.png

            adb logcat -c
            adb shell am start -W -n com.saintsai.stock/.MainActivity
            sleep 10
            adb shell pidof com.saintsai.stock
            adb logcat -d -b crash > android-app/client-crash.txt
            if grep -F "Process: com.saintsai.stock" android-app/client-crash.txt; then exit 1; fi
            adb exec-out screencap -p > android-app/estoque-screen.png
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest
            mkdir -p android-app/layout-threebutton
            adb pull /sdcard/Download/saintsai-layout/. android-app/layout-threebutton/
            cp -r android-app/estoqueapp/build/outputs/androidTest-results/connected android-app/layout-threebutton/results
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest --rerun-tasks
            mkdir -p android-app/layout-gestures
            adb pull /sdcard/Download/saintsai-layout/. android-app/layout-gestures/


      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Emulator-Screens
          path: |
            android-app/admin-screen.png
            android-app/estoque-screen.png
            android-app/layout-threebutton/
            android-app/layout-gestures/
            android-app/estoqueapp/build/reports/androidTests/
            android-app/client-crash.txt
          if-no-files-found: error

      - name: Rename APKs
        run: |
          cp adminapp/build/outputs/apk/debug/adminapp-debug.apk Agente-SaintsAI-v1.0.16.apk
          cp estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk SaintsAI-Cliente-v1.2.1.apk\n          if [ -n "$SALES_KEYSTORE_B64" ]; then
            cp salesnotify/build/outputs/apk/release/salesnotify-release.apk Gerenciador-de-Vendas-v1.0.0.apk
          else
            cp salesnotify/build/outputs/apk/debug/salesnotify-debug.apk Gerenciador-de-Vendas-v1.0.0.apk
          fi

      - name: Upload Agente SaintsAI
        uses: actions/upload-artifact@v4
        with:
          name: Agente-SaintsAI-APK-v1.0.16
          path: android-app/Agente-SaintsAI-v1.0.16.apk
          if-no-files-found: error

      - name: Upload SaintsAI Estoque
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Cliente-APK-v1.2.1
          path: android-app/SaintsAI-Cliente-v1.2.1.apk
          if-no-files-found: error


      - name: Upload Gerenciador de Vendas
        uses: actions/upload-artifact@v4
        with:
          name: Gerenciador-de-Vendas-APK-v1.0.0
          path: android-app/Gerenciador-de-Vendas-v1.0.0.apk
          if-no-files-found: error


      - name: Publish latest Gerenciador APK
        if: env.SALES_KEYSTORE_B64 != ''
        run: |
          mkdir -p ../downloads
          cp Gerenciador-de-Vendas-v1.0.0.apk ../downloads/Gerenciador-de-Vendas.apk
          cat > ../downloads/gerenciador-vendas.json <<'EOF'
          {"versionCode":1,"versionName":"1.0.0","apk":"https://raw.githubusercontent.com/Alvesrs/loja-ia-saas/main/downloads/Gerenciador-de-Vendas.apk"}
          EOF
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Gerenciador-de-Vendas.apk downloads/gerenciador-vendas.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: atualiza Gerenciador de Vendas APK [skip ci]"
          git push
