name: Build Agente SaintsAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :clientapp:assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Agente-SaintsAI-v1.0.4.apk
          cp clientapp/build/outputs/apk/debug/clientapp-debug.apk SaintsAI-Estoque-v1.0.0.apk

      - name: Upload Agente SaintsAI
        uses: actions/upload-artifact@v4
        with:
          name: Agente-SaintsAI-APK-v1.0.4
          path: android-app/Agente-SaintsAI-v1.0.4.apk
          if-no-files-found: error

      - name: Upload SaintsAI Estoque
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Estoque-APK-v1.0.0
          path: android-app/SaintsAI-Estoque-v1.0.0.apk
          if-no-files-found: error
