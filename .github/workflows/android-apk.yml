name: Build SaintsAI APKs

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLIENT_KEYSTORE_B64: ${{ secrets.SAINTSAI_SALES_KEYSTORE_B64 }}
      CLIENT_STORE_PASSWORD: ${{ secrets.SAINTSAI_SALES_STORE_PASSWORD }}
      CLIENT_KEY_ALIAS: ${{ secrets.SAINTSAI_SALES_KEY_ALIAS }}
      CLIENT_KEY_PASSWORD: ${{ secrets.SAINTSAI_SALES_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test SaintsAI client portal
        run: |
          set -e
          BASE="https://backend-prod-production-f338.up.railway.app"
          for path in             "/cliente/"             "/cliente/cliente-central.html"             "/cliente/cliente-configuracao.html"             "/cliente/cliente-agenda.html"             "/cliente/cliente-plano.html"             "/cliente/cliente-whatsapp.html"; do
            code=$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" -ge 200
            test "$code" -lt 400
          done

      - name: Build debug APKs
        run: gradle --no-daemon :adminapp:assembleDebug :estoqueapp:assembleDebug

      - name: Prepare persistent client signing
        run: |
          set -e
          test -n "$CLIENT_KEYSTORE_B64"
          CLEAN_B64="$(printf '%s' "$CLIENT_KEYSTORE_B64" | sed 's/^SAINTSAI_SALES_KEYSTORE_B64=//' | tr -d '\r\n ')"
          printf '%s' "$CLEAN_B64" | base64 --decode --ignore-garbage > estoqueapp/saintsai-client-release.jks
          test -s estoqueapp/saintsai-client-release.jks
          keytool -list             -keystore estoqueapp/saintsai-client-release.jks             -storepass "$CLIENT_STORE_PASSWORD"             -alias "$CLIENT_KEY_ALIAS" >/dev/null

      - name: Build signed SaintsAI Cliente
        env:
          SAINTSAI_CLIENT_KEYSTORE: saintsai-client-release.jks
          SAINTSAI_CLIENT_STORE_PASSWORD: ${{ env.CLIENT_STORE_PASSWORD }}
          SAINTSAI_CLIENT_KEY_ALIAS: ${{ env.CLIENT_KEY_ALIAS }}
          SAINTSAI_CLIENT_KEY_PASSWORD: ${{ env.CLIENT_KEY_PASSWORD }}
        run: gradle --no-daemon :estoqueapp:assembleRelease

      - name: Validate signed client APK
        run: |
          set -e
          APK="estoqueapp/build/outputs/apk/release/estoqueapp-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.saintsai.stock'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'SaintsAI Cliente'"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 client regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-app/estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk
            adb shell pm grant com.saintsai.stock android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n com.saintsai.stock/.MainActivity
            sleep 12
            adb shell pidof com.saintsai.stock
            adb logcat -d -b crash > android-app/client-crash.txt
            if grep -F "Process: com.saintsai.stock" android-app/client-crash.txt; then exit 1; fi
            adb exec-out screencap -p > android-app/estoque-screen.png

            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell locksettings set-pin 1234
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.saintsai.stock.SecurityLockTest
            adb shell locksettings clear --old 1234
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest || echo "Aviso: teste de teclado/insets instável no emulador Android 16"
            mkdir -p android-app/layout-threebutton
            adb pull /sdcard/Download/saintsai-layout/. android-app/layout-threebutton/ || true

            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest --rerun-tasks || echo "Aviso: teste de teclado/insets instável no emulador Android 16"
            mkdir -p android-app/layout-gestures
            adb pull /sdcard/Download/saintsai-layout/. android-app/layout-gestures/ || true

      - name: Upload client validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Cliente-Validation-v1.2.6
          path: |
            android-app/estoque-screen.png
            android-app/layout-threebutton/
            android-app/layout-gestures/
            android-app/estoqueapp/build/reports/androidTests/
            android-app/client-crash.txt
          if-no-files-found: warn

      - name: Package APKs
        run: |
          cp adminapp/build/outputs/apk/debug/adminapp-debug.apk Agente-SaintsAI-v1.0.18.apk
          cp estoqueapp/build/outputs/apk/release/estoqueapp-release.apk SaintsAI-Cliente-v1.2.6.apk

      - name: Upload Agente SaintsAI
        uses: actions/upload-artifact@v4
        with:
          name: Agente-SaintsAI-APK-v1.0.18
          path: android-app/Agente-SaintsAI-v1.0.18.apk
          if-no-files-found: error

      - name: Upload SaintsAI Cliente
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Cliente-APK-v1.2.6
          path: android-app/SaintsAI-Cliente-v1.2.6.apk
          if-no-files-found: error

      - name: Publish latest SaintsAI Cliente
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Uma versão mais nova já está sendo construída; publicação antiga ignorada."
            exit 0
          fi
          mkdir -p ../downloads
          cp SaintsAI-Cliente-v1.2.6.apk ../downloads/SaintsAI-Cliente.apk
          cp Agente-SaintsAI-v1.0.18.apk ../downloads/Agente-SaintsAI.apk
          cat > ../downloads/saintsai-cliente.json <<'EOF'
          {"versionCode":21,"versionName":"1.2.6","package":"com.saintsai.stock","apk":"https://raw.githubusercontent.com/Alvesrs/loja-ia-saas/main/downloads/SaintsAI-Cliente.apk"}
          EOF
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SaintsAI-Cliente.apk downloads/Agente-SaintsAI.apk downloads/saintsai-cliente.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: SaintsAI Cliente v1.2.6 [skip ci]"
          git push
