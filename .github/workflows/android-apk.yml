name: Build SaintsAI APKs
# retest proxy real
# final retest after backend mount
# backend mount verified retest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test SaintsAI client portal
        run: |
          set -e
          BASE="https://backend-prod-production-f338.up.railway.app"
          for path in \
            "/cliente/" \
            "/cliente/cliente-central.html" \
            "/cliente/cliente-configuracao.html" \
            "/cliente/cliente-agenda.html" \
            "/cliente/cliente-plano.html" \
            "/cliente/cliente-whatsapp.html"; do
            echo "===== $path ====="
            code=$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" "$BASE$path")
            echo "HTTP $code"
            test "$code" -ge 200
            test "$code" -lt 400
          done
          curl -fsSL "$BASE/cliente/cliente-agenda.html" -o /tmp/agenda.html
          grep -F "Agenda profissional" /tmp/agenda.html
          grep -F "No-show" /tmp/agenda.html
          curl -fsSL "$BASE/cliente/cliente-plano.html" -o /tmp/plano.html
          grep -F "Plano e cobrança" /tmp/plano.html
          curl -fsSL "$BASE/cliente/cliente-whatsapp.html" -o /tmp/whatsapp.html
          grep -F "SaintsAI · WhatsApp" /tmp/whatsapp.html

      - name: Build APKs
        run: gradle --no-daemon :adminapp:assembleDebug :estoqueapp:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator visual test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-app/adminapp/build/outputs/apk/debug/adminapp-debug.apk
            adb install -r android-app/estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk

            adb shell am force-stop com.saintsai.admin
            adb shell monkey -p com.saintsai.admin -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-app/admin-screen.png

            adb shell am force-stop com.saintsai.stock
            adb shell monkey -p com.saintsai.stock -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof com.saintsai.stock
            adb logcat -d > /tmp/saintsai-logcat.txt
            if grep -F "FATAL EXCEPTION" /tmp/saintsai-logcat.txt | grep -F "com.saintsai.stock"; then echo "SaintsAI Cliente sofreu crash"; exit 1; else echo "SaintsAI Cliente sem crash"; fi
            adb exec-out screencap -p > android-app/estoque-screen.png

      - name: Upload emulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Emulator-Screens
          path: |
            android-app/admin-screen.png
            android-app/estoque-screen.png
          if-no-files-found: error

      - name: Rename APKs
        run: |
          cp adminapp/build/outputs/apk/debug/adminapp-debug.apk Agente-SaintsAI-v1.0.16.apk
          cp estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk SaintsAI-Cliente-v1.2.0.apk

      - name: Upload Agente SaintsAI
        uses: actions/upload-artifact@v4
        with:
          name: Agente-SaintsAI-APK-v1.0.16
          path: android-app/Agente-SaintsAI-v1.0.16.apk
          if-no-files-found: error

      - name: Upload SaintsAI Estoque
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Cliente-APK-v1.2.0
          path: android-app/SaintsAI-Cliente-v1.2.0.apk
          if-no-files-found: error
