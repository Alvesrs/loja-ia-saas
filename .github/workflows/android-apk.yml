name: Build SaintsAI APKs
# retest proxy real
# final retest after backend mount
# backend mount verified retest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test Supabase proxy routes
        run: |
          set -e
          for path in \
            "/painel/" \
            "/painel/login.html?next=cliente-estoque.html"; do
            echo "===== $path ====="
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" "https://ldpiryzsunxwuhyvvogg.supabase.co/functions/v1/saintsai-proxy$path")
            echo "HTTP $code"
            head -c 300 /tmp/body.txt || true
            echo
            test "$code" -ge 200
            test "$code" -lt 400
          done

      - name: Build APKs
        run: gradle --no-daemon :adminapp:assembleDebug :estoqueapp:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator visual test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android-app/adminapp/build/outputs/apk/debug/adminapp-debug.apk
            adb install -r android-app/estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk

            adb shell am force-stop com.saintsai.admin
            adb shell monkey -p com.saintsai.admin -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-app/admin-screen.png

            adb shell am force-stop com.saintsai.stock
            adb shell monkey -p com.saintsai.stock -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > android-app/estoque-screen.png

      - name: Upload emulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Emulator-Screens
          path: |
            android-app/admin-screen.png
            android-app/estoque-screen.png
          if-no-files-found: error

      - name: Rename APKs
        run: |
          cp adminapp/build/outputs/apk/debug/adminapp-debug.apk SaintsAI-Admin-v1.0.5.apk
          cp estoqueapp/build/outputs/apk/debug/estoqueapp-debug.apk SaintsAI-Estoque-v1.0.5.apk

      - name: Upload SaintsAI Admin
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Admin-APK-v1.0.5
          path: android-app/SaintsAI-Admin-v1.0.5.apk
          if-no-files-found: error

      - name: Upload SaintsAI Estoque
        uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-Estoque-APK-v1.0.5
          path: android-app/SaintsAI-Estoque-v1.0.5.apk
          if-no-files-found: error
