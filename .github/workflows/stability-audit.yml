name: SaintsAI stability audit
on:
  pull_request:
    paths:
      - 'Dockerfile.backend'
      - 'patches/**'
      - 'tests/**'
      - 'sql/stability/**'
      - '.github/workflows/stability-audit.yml'
  push:
    branches: ['audit/saintsai-stability-20261013']
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: saintsai_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: saintsai_stability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saintsai_ci -d saintsai_stability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify durable send intent in real isolated Postgres
        env:
          SAINTSAI_ISOLATED_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: saintsai_ci
          PGPASSWORD: isolated_ci_only
          PGDATABASE: saintsai_stability_test
        run: node --test tests/send-intent-postgres.integration.cjs tests/waha-batch-postgres.integration.cjs
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image with isolated synthetic regression tests
        shell: bash
        run: |
          set -euo pipefail
          if ! docker build -f Dockerfile.backend -t saintsai-audit:${{ github.sha }} . 2>&1 | tee /tmp/saintsai-build.log; then
            if grep -Eq '429 Too Many Requests|toomanyrequests: Data limit exceeded' /tmp/saintsai-build.log; then
              docker build --build-arg NODE_BASE_IMAGE=node:22-bookworm -f Dockerfile.backend -t saintsai-audit:${{ github.sha }} .
            else
              exit 1
            fi
          fi
      - name: Validate all compiled backend modules
        run: docker run --rm --entrypoint sh saintsai-audit:${{ github.sha }} -c 'find src -name "*.js" -print0 | xargs -0 -n 1 node --check'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser validation of compiled interface
        run: |
          npm install --prefix "$RUNNER_TEMP/saintsai-ui" playwright@1.62.1
          node "$RUNNER_TEMP/saintsai-ui/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/saintsai-ui-runtime"
          cid=$(docker create saintsai-audit:${{ github.sha }})
          docker cp "$cid:/app/public" "$RUNNER_TEMP/saintsai-ui-runtime/public"
          docker cp "$cid:/app/src" "$RUNNER_TEMP/saintsai-ui-runtime/src"
          docker cp "$cid:/app/tests" "$RUNNER_TEMP/saintsai-ui-runtime/tests"
          docker cp "$cid:/app/patches" "$RUNNER_TEMP/saintsai-ui-runtime/patches"
          docker cp "$cid:/app/package.json" "$RUNNER_TEMP/saintsai-ui-runtime/package.json"
          tar czf "$RUNNER_TEMP/saintsai-compiled-runtime.tar.gz" -C "$RUNNER_TEMP/saintsai-ui-runtime" src tests public patches package.json
          docker rm "$cid"
      - uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-compiled-runtime
          path: ${{ runner.temp }}/saintsai-compiled-runtime.tar.gz
      - name: Verify existing workflows on mobile and desktop
        run: |
          cd "$RUNNER_TEMP/saintsai-ui-runtime"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/saintsai-ui/node_modules/playwright" node "$GITHUB_WORKSPACE/tests/remake-ui-browser.cjs"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/saintsai-ui/node_modules/playwright" node "$GITHUB_WORKSPACE/tests/configuration-forms-browser.cjs"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/saintsai-ui/node_modules/playwright" node "$GITHUB_WORKSPACE/tests/prospect-consent-browser.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SaintsAI-interface-review
          path: ${{ runner.temp }}/saintsai-ui-runtime/ui-artifacts/
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install current application SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile existing applications and instrumentation tests
        working-directory: android-app
        run: gradle --no-daemon :adminapp:assembleDebug :adminapp:assembleDebugAndroidTest :estoqueapp:assembleDebug :estoqueapp:assembleDebugAndroidTest :salesnotify:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SaintsAI-isolated-debug-builds
          path: |
            android-app/adminapp/build/outputs/apk/debug/*.apk
            android-app/estoqueapp/build/outputs/apk/debug/*.apk
            android-app/salesnotify/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run Android navigation and security regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell locksettings set-pin 1234
            gradle -p android-app --no-daemon :adminapp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.saintsai.admin.ExternalLinksTest
            gradle -p android-app --no-daemon :estoqueapp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.saintsai.stock.ExternalLinksTest,com.saintsai.stock.DistributionPolicyTest,com.saintsai.stock.AppIconSwitchTest,com.saintsai.stock.SecurityLockTest || { mkdir -p android-app/device-evidence; adb pull /sdcard/Android/data/com.saintsai.stock/files/pin-failure.xml android-app/device-evidence/ || true; adb pull /sdcard/Android/data/com.saintsai.stock/files/pin-failure.png android-app/device-evidence/ || true; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SaintsAI-Android-regression-reports
          path: |
            android-app/adminapp/build/reports/androidTests/
            android-app/estoqueapp/build/reports/androidTests/
            android-app/device-evidence/
            android-app/estoqueapp/build/outputs/androidTest-results/
            android-app/adminapp/build/outputs/androidTest-results/
