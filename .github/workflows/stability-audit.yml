name: SaintsAI stability audit
on:
  pull_request:
    paths:
      - 'Dockerfile.backend'
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/stability-audit.yml'
  push:
    branches: ['audit/saintsai-stability-20261013']
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: saintsai_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: saintsai_stability_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saintsai_ci -d saintsai_stability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify durable send intent in real isolated Postgres
        env:
          SAINTSAI_ISOLATED_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: saintsai_ci
          PGPASSWORD: isolated_ci_only
          PGDATABASE: saintsai_stability_test
        run: node --test tests/send-intent-postgres.integration.cjs
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image with isolated synthetic regression tests
        shell: bash
        run: |
          set -euo pipefail
          if ! docker build -f Dockerfile.backend -t saintsai-audit:${{ github.sha }} . 2>&1 | tee /tmp/saintsai-build.log; then
            if rg -q '429 Too Many Requests|toomanyrequests: Data limit exceeded' /tmp/saintsai-build.log; then
              docker build --build-arg NODE_BASE_IMAGE=node:22-bookworm -f Dockerfile.backend -t saintsai-audit:${{ github.sha }} .
            else
              exit 1
            fi
          fi
      - name: Validate compiled syntax
        run: docker run --rm --entrypoint node saintsai-audit:${{ github.sha }} --check src/services/whatsappWorker.service.js
