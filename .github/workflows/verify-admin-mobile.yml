name: Verify SaintsAI Admin Mobile Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-admin-mobile.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live admin mobile page through Supabase proxy
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ldpiryzsunxwuhyvvogg.supabase.co/functions/v1/saintsai-proxy/painel"
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/admin-mobile.html" -o /tmp/admin.html
          grep -F "Registrar novo cliente" /tmp/admin.html
          grep -F "Prompt Mestre" /tmp/admin.html
          grep -F "Personalidade do agente" /tmp/admin.html
          grep -F "Gerar Pix" /tmp/admin.html
          grep -F "Número oficial do dono" /tmp/admin.html
          grep -F "REGISTRO TESTE" /tmp/admin.html
          grep -F "ESTOQUE" /tmp/admin.html
          grep -F "Selecionar cliente" /tmp/admin.html
          grep -F "Criar teste e liberar WhatsApp" /tmp/admin.html
          grep -F "admin-estoque.html" /tmp/admin.html
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/admin.html" -o /tmp/admin-old.html
          grep -F "admin-mobile.html" /tmp/admin-old.html
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/admin-estoque.html?loja=00000000-0000-0000-0000-000000000000" -o /tmp/estoque.html
          grep -F "Estoque do cliente" /tmp/estoque.html
          grep -F "admin-mobile.html#estoque" /tmp/estoque.html
          grep -F "clientesSubmenu" /tmp/admin.html
          grep -F "estoqueSubmenu" /tmp/admin.html
          grep -F "Abrir estoque sincronizado" /tmp/admin.html
          grep -F "Preferências do Agente SaintsAI" /tmp/admin.html
          grep -F "SAINTSAI_ADMIN_UI_VERSION" /tmp/admin.html
          if grep -F "location.href='configuracoes.html'" /tmp/admin.html; then
            echo "Configurações ainda aponta para o legado" >&2
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/configuracoes.html" -o /tmp/config.html
          grep -F "admin-mobile.html?v=4#config" /tmp/config.html
          grep -F "🏠 INÍCIO" /tmp/admin.html
          grep -F "💰 VENDAS" /tmp/admin.html
          grep -F "Faturamento hoje" /tmp/admin.html
          grep -F "Lucro hoje" /tmp/admin.html
          grep -F "Ticket médio" /tmp/admin.html
          grep -F "Registrar venda e baixar estoque" /tmp/admin.html
          grep -F "SAINTSAI_ADMIN_UI_VERSION=\"v6\"" /tmp/admin.html
          grep -F "saints-v6-theme" /tmp/admin.html
          grep -F "class=\"saintsHeader\"" /tmp/admin.html
          grep -F "SaintsAI" /tmp/admin.html
          grep -F "By Alves" /tmp/admin.html
          grep -F "data-saints-theme=\"light\"" /tmp/admin.html
          grep -F "#1677ff" /tmp/admin.html
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/admin.html" -o /tmp/admin-old-v6.html
          grep -F "admin-mobile.html?v=6#home" /tmp/admin-old-v6.html
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/configuracoes.html" -o /tmp/config-v6.html
          grep -F "admin-mobile.html?v=6#config" /tmp/config-v6.html
          code=$(curl -sS -o /tmp/vendas-api.txt -w "%{http_code}" "https://backend-prod-production-f338.up.railway.app/api/admin/vendas/resumo")
          echo "Vendas API sem login: HTTP $code"
          test "$code" -ne 404
          test "$code" -ge 400
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/login.html?next=admin-mobile.html" -o /tmp/login.html
          grep -F "admin-mobile.html" /tmp/login.html
          echo "LIVE_ADMIN_MOBILE_OK"
